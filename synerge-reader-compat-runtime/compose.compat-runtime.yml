# Compatibility generation runtime (runtime key "compat_cuda121") -- overlay.
#
# Use as an additional file after the release compose file, from the same
# directory and with the same project name and --env-file:
#
#   docker-compose -p <project> --env-file <env> -f <release compose> -f compose.compat-runtime.yml ...
#
# Every ${...:?} value must be supplied by the render step after it was verified
# on the host (see README.md). Nothing here is a default for production.
#
# What this adds:
#   * compat-ollama: the pinned CUDA 12.1 / SM70 Ollama 0.32.12 image, referenced
#     by IMAGE ID; GPUs 0, 1 and 3 only, by UUID (NVIDIA_VISIBLE_DEVICES overrides
#     the image's "all"; GPU 2 is never listed); NO published port; attached ONLY to
#     the internal network compat_private, where it answers to the unique alias
#     synergereader-compat-ollama; read-only root filesystem; runtime state in tmpfs;
#     every capability dropped; no-new-privileges; bounded logs and resources; the
#     staged model store (stage_model_store.py) mounted read-only;
#   * backend: joins compat_private and receives the endpoint and the experimental
#     switch as server configuration. SYNERGE_EXPERIMENTAL_MODELS defaults to off.
#     The global OLLAMA_BASE_URL is NOT changed: Gemma, Llama and the embedder stay
#     on the host Ollama.
#
# The kernel on the DGX has no swap-limit support: the daemon records
# MemorySwap=-1 and memswap_limit is not enforced there. mem_limit is.

networks:
  compat_private:
    internal: true

volumes:
  compat_models:
    external: true
    name: "${SYNERGE_COMPAT_MODEL_VOLUME:?model store volume}"

services:
  backend:
    networks:
      - default
      - compat_private
    environment:
      - SYNERGE_COMPAT_OLLAMA_URL=http://synergereader-compat-ollama:11434
      - SYNERGE_EXPERIMENTAL_MODELS=${SYNERGE_EXPERIMENTAL_MODELS:-0}

  compat-ollama:
    image: "${SYNERGE_COMPAT_IMAGE_ID:?compat image id}"
    entrypoint: ["/bin/ollama"]
    command: ["serve"]
    runtime: nvidia
    networks:
      compat_private:
        aliases:
          - synergereader-compat-ollama
    volumes:
      - compat_models:/cached:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=${SYNERGE_COMPAT_GPU_UUIDS:?three GPU UUIDs}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_MODELS=/cached/models
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NOPRUNE=1
      - OLLAMA_NO_CLOUD=1
      - OLLAMA_LLM_LIBRARY=cuda_v12
      - OLLAMA_FLASH_ATTENTION=false
      - OLLAMA_KV_CACHE_TYPE=f16
      - OLLAMA_SCHED_SPREAD=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_CONTEXT_LENGTH=8192
      - OLLAMA_KEEP_ALIVE=5m
      - CUDA_MODULE_LOADING=EAGER
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
      - /root/.ollama:size=64m,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 128g
    memswap_limit: 128g
    cpus: 8
    pids_limit: 512
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "2"
        compress: "false"
    restart: unless-stopped
